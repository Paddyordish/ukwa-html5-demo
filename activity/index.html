<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10273c"><title>UKWA · Warehouse hazard practice</title><meta name="ukwa-build" content="embed-20261028-v9"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;650;700;750;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><main class="activity" aria-label="Warehouse hazard practice">
<header class="toolbar"><img class="brand" src="../assets/brand/ukwa-logo.png" width="2048" height="545" alt="UKWA — The Voice of Warehousing"><div class="progress"><span id="count" role="status">0 of 6 explored</span><span id="completion" class="completion" role="status" aria-live="polite" aria-atomic="true"></span><progress id="progress" value="0" max="6" aria-label="Hazards explored"></progress></div></header>
<div class="workspace" id="workspace"><div class="scene-frame" id="scene-frame"><div class="scene" id="scene" aria-label="Warehouse inspection areas" aria-describedby="explore-help"><img id="warehouse" src="assets/warehouse.svg" width="1440" height="900" draggable="false" alt="Warehouse with six hazards to inspect: a worker climbing racking, a spill, unstable boxes, an obstructed emergency exit, a damaged upright and discarded strapping."><div id="markers"></div><div class="lens" id="lens" aria-hidden="true"><span></span></div><span class="lens-label" id="lens-label" aria-hidden="true" hidden></span></div></div>
<dialog id="panel" class="popup" aria-labelledby="panel-title" aria-describedby="hazard-description" hidden></dialog></div>
<div class="scene-tools"><p id="explore-help"><span class="pointer-help">Move to explore · click to inspect</span><span class="touch-help">Tap · hold to magnify</span></p><div class="tools-actions"><button type="button" class="find-one" id="find-one">Help me find one</button><button type="button" class="find-one" id="restart" aria-label="Restart activity">Restart</button></div></div>

<p class="sr-only" id="keyboard-help">Tab to each inspection area; its outline appears on focus. Arrow keys move between areas and magnify the detail. Enter or Space opens a decision. Escape returns to the scene.</p><p class="sr-only" id="hint-status" role="status"></p><noscript><p>Enable JavaScript to inspect the hazards and choose responses.</p></noscript>
</main><script src="app.js"></script></body></html>
